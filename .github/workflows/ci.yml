name: LanPanel quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: LanPanel Go quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go from go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install pinned linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.3

      - name: Install real lifecycle fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          sudo chmod u+s "$(command -v bwrap)"

      - name: Run LanPanel Go quality gate
        run: make preview-local-gate

      - name: Run real Nginx HTTPS integration gate
        run: make nginx-https-integration

      - name: Set up Node.js for browser fixture
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install browser test dependencies
        run: npm ci

      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic browser fixture gate
        run: make playwright-fixture-gate
