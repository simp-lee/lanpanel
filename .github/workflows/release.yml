name: Release publication disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-disabled:
    name: Refuse incomplete release publication
    runs-on: ubuntu-latest
    steps:
      - name: Live qualification input is not configured
        run: |
          echo "Release publication remains disabled until P7 live qualification and final same-bytes readiness complete." >&2
          exit 1
