name: Publish LanPanel release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pushed tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Go from go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install pinned linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.3

      - name: Validate stable release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo 'tag must be a stable semantic version such as vMAJOR.MINOR.PATCH' >&2
            exit 2
          fi

      - name: Install real lifecycle fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          sudo chmod u+s "$(command -v bwrap)"

      - name: Run release quality gate
        run: make preview-local-gate

      - name: Materialize the release signing key
        env:
          RELEASE_KEY_B64: ${{ secrets.LANPANEL_RELEASE_PRIVATE_KEY_B64 }}
        run: |
          test -n "$RELEASE_KEY_B64" || { echo 'LANPANEL_RELEASE_PRIVATE_KEY_B64 secret is required' >&2; exit 1; }
          printf '%s' "$RELEASE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/lanpanel-release-signing-key"
          chmod 600 "$RUNNER_TEMP/lanpanel-release-signing-key"

      - name: Run the shared release orchestrator
        env:
          PREVIEW_TAG: ${{ github.ref_name }}
          PREVIEW_SIGNING_KEY: ${{ runner.temp }}/lanpanel-release-signing-key
          PREVIEW_MANIFEST_TEMPLATE: release-inputs/manifest-template.json
          PREVIEW_PROFILE_INPUT_DIR: release-inputs/profiles/linux-amd64-apt-dpkg-systemd
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          make release-preview \
            PREVIEW_TAG="$PREVIEW_TAG" \
            PREVIEW_SOURCE_DIR=. \
            PREVIEW_DEPENDENCY_DIR="$PWD/dist/dependencies" \
            PREVIEW_MANIFEST_TEMPLATE="$PREVIEW_MANIFEST_TEMPLATE" \
            PREVIEW_PROFILE_INPUT_DIR="$PREVIEW_PROFILE_INPUT_DIR" \
            PREVIEW_SIGNING_KEY="$PREVIEW_SIGNING_KEY" \
            PREVIEW_ARTIFACT_DIR="$PWD/dist/release" \
            PREVIEW_DOWNLOAD_BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$PREVIEW_TAG" \
            PREVIEW_OUTPUT_DIR="$PWD/dist/releases"

      - name: Upload and verify the GitHub Release
        env:
          PREVIEW_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          make publish-preview-github \
            PREVIEW_TAG="$PREVIEW_TAG" \
            PREVIEW_OUTPUT_DIR="$PWD/dist/releases"
